name: Build unsigned iOS ipa

on:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "tests/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build device app (unsigned)
        timeout-minutes: 15
        working-directory: ios/App
        run: |
          set -o pipefail
          if xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee build-device.log | tail -60; then
            echo "BUILD_OK"
          else
            grep -E "error:" build-device.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/App/build-device.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          APP=ios/App/build/Build/Products/Release-iphoneos/App.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry myfood-unsigned.ipa Payload
          rm -rf Payload
          ls -lh myfood-unsigned.ipa

      - name: Resolve simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"

      - name: Build simulator app
        timeout-minutes: 15
        working-directory: ios/App
        run: |
          set -o pipefail
          if xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build 2>&1 | tee build-sim.log | tail -40; then
            echo "BUILD_OK"
          else
            grep -E "error:" build-sim.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Core regression compile (isolated)
        timeout-minutes: 5
        run: |
          set -o pipefail
          swiftc -DDEBUG ios/App/App/API.swift ios/App/App/AppState.swift ios/App/App/OfflineStore.swift ios/App/App/GCJConverter.swift ios/App/App/SyncLog.swift ios/App/App/SyncDiff.swift ios/App/App/TestSupport.swift tests/CoreTests.swift -o /tmp/myfood-core-tests 2>&1 | tee core-compile.log

      - name: Core regression run (isolated)
        timeout-minutes: 5
        run: |
          set -o pipefail
          /tmp/myfood-core-tests 2>&1 | tee core-run.log

      - name: Runner script gate (isolated)
        timeout-minutes: 5
        run: bash tests/test_simulator_runner.sh

      - name: Python unittest gate
        timeout-minutes: 3
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Launch on simulator and smoke-tour
        timeout-minutes: 15
        run: |
          set -euo pipefail
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          bash tests/run_simulator_tests.sh "$UDID" smoke > smoke-debug.txt 2>&1

      - name: Run in-app self tests (-autoTest, isolated)
        timeout-minutes: 15
        run: bash tests/run_simulator_tests.sh "${{ steps.sim.outputs.udid }}" autotest > auto-test.txt 2>&1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: myfood-unsigned-ipa
          path: myfood-unsigned.ipa
          if-no-files-found: error

      - name: Collect simulator crash reports
        if: always()
        run: |
          mkdir -p crashlogs
          cp "$HOME"/Library/Logs/DiagnosticReports/*yfood* crashlogs/ 2>/dev/null || true
          cp "$HOME"/Library/Logs/DiagnosticReports/App-* crashlogs/ 2>/dev/null || true

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            smoke/
            autotest/
            smoke-debug.txt
            auto-test.txt
            core-compile.log
            core-run.log
            *-console.txt
            ios/App/build-sim.log
            crashlogs/
          if-no-files-found: ignore

      - name: Publish IPA to release
        if: github.ref == 'refs/heads/master'
        run: |
          gh release create "ipa-${{ github.run_number }}" myfood-unsigned.ipa smoke-debug.txt auto-test.txt smoke/*.png \
            --title "MyFood 未签名 IPA (build ${{ github.run_number }})" \
            --notes "Sideloadly 直接装这个 ipa。功能巡访截图见 smoke-screenshots artifact。" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prune old ipa releases (keep latest only)
        if: github.ref == 'refs/heads/master'
        run: |
          # 只保留最新一个 release：删旧 ipa-N release 并连带删 tag（--cleanup-tag 防孤儿 tag 堆积）
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '.[].tagName' | grep -E '^ipa-[0-9]+$' |
          while read -r tag; do
            n=${tag#ipa-}
            if [ "$n" -lt "${{ github.run_number }}" ]; then
              echo "pruning $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
