name: Build unsigned iOS ipa

on:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "www/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build device app (unsigned)
        working-directory: ios/App
        run: |
          set -o pipefail
          if xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build-device.log | tail -60; then
            echo "BUILD_OK"
          else
            grep -E "error:" build-device.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/App/build-device.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          APP=ios/App/build/Build/Products/Release-iphoneos/App.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry myfood-unsigned.ipa Payload
          rm -rf Payload
          ls -lh myfood-unsigned.ipa

      - name: Resolve simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"

      - name: Build simulator app
        working-directory: ios/App
        run: |
          set -o pipefail
          if xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build-sim.log | tail -40; then
            echo "BUILD_OK"
          else
            grep -E "error:" build-sim.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Launch on simulator and smoke-tour
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" com.tokeiyo929.myfood -autoSmoke
          APPC=$(xcrun simctl get_app_container "$UDID" com.tokeiyo929.myfood data)
          # 轮询等 app 巡访完成（done.txt 标记），最多 90s
          for i in $(seq 1 45); do
            sleep 2
            if [ -f "$APPC/tmp/smoke/done.txt" ]; then echo "smoke tour done after ~$((i*2))s"; break; fi
          done
          mkdir -p smoke
          cp "$APPC/tmp/smoke/"*.png smoke/ 2>/dev/null || true
          ls -lh smoke/ || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: myfood-unsigned-ipa
          path: myfood-unsigned.ipa
          if-no-files-found: error

      - name: Upload smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke/
          if-no-files-found: error

      - name: Publish IPA to release
        run: |
          gh release create "ipa-${{ github.run_number }}" myfood-unsigned.ipa \
            --title "MyFood 未签名 IPA (build ${{ github.run_number }})" \
            --notes "Sideloadly 直接装这个 ipa。功能巡访截图见 smoke-screenshots artifact。" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
