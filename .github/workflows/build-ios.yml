name: Build unsigned iOS ipa

on:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "www/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build device app (unsigned)
        working-directory: ios/App
        run: |
          set -o pipefail
          if xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build-device.log | tail -60; then
            echo "BUILD_OK"
          else
            grep -E "error:" build-device.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/App/build-device.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          APP=ios/App/build/Build/Products/Release-iphoneos/App.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry myfood-unsigned.ipa Payload
          rm -rf Payload
          ls -lh myfood-unsigned.ipa

      - name: Resolve simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"

      - name: Build simulator app
        working-directory: ios/App
        run: |
          set -o pipefail
          if xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build 2>&1 | tee build-sim.log | tail -40; then
            echo "BUILD_OK"
          else
            grep -E "error:" build-sim.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Launch on simulator and smoke-tour
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          {
            echo "== clean install =="
            xcrun simctl terminate "$UDID" com.tokeiyo929.myfood 2>/dev/null || true
            xcrun simctl uninstall "$UDID" com.tokeiyo929.myfood 2>/dev/null || true
            xcrun simctl install "$UDID" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
            APPC=$(xcrun simctl get_app_container "$UDID" com.tokeiyo929.myfood data 2>&1) || true
            echo "APPC=$APPC"
            mkdir -p smoke
            rm -f "$APPC/tmp/smoke/"now-* "$APPC/tmp/smoke/"ack-* 2>/dev/null || true
            echo "== console launch (marker/ack handshake; app exits after tour) =="
            xcrun simctl launch --console "$UDID" com.tokeiyo929.myfood -autoSmoke > smoke-console.txt 2>&1 &
            CPID=$!
            # app 写 now-XX → runner 截屏写 ack-XX → app 走下一步；done.txt 结束
            for i in $(seq 1 120); do
              for n in 01-history 02-detail 03-record 04-map-china 05-map-europe 06-rank 07-tracks 08-settings; do
                if [ -f "$APPC/tmp/smoke/now-$n" ] && [ ! -f "smoke/$n.png" ]; then
                  sleep 1
                  if xcrun simctl io "$UDID" screenshot "smoke/$n.png" 2>/dev/null; then
                    : > "$APPC/tmp/smoke/ack-$n" 2>/dev/null || true
                    echo "captured $n at ~${i}s"
                  else
                    echo "screenshot $n FAILED (will retry)"
                  fi
                fi
              done
              if [ -f "$APPC/tmp/smoke/done.txt" ]; then echo "tour done after ~${i}s"; break; fi
              if ! kill -0 "$CPID" 2>/dev/null; then echo "app exited early at ~${i}s"; break; fi
              sleep 1
            done
            kill "$CPID" 2>/dev/null || true
            wait "$CPID" 2>/dev/null || true
            echo "-- console output --"
            head -80 smoke-console.txt || true
            echo "== tmp/smoke listing =="
            ls -la "$APPC/tmp/smoke/" 2>&1 || true
            echo "== screenshots =="
            ls -la smoke/ || true
          } > smoke-debug.txt 2>&1 || true
          cat smoke-debug.txt || true
          cp "$APPC/tmp/smoke/"smoke-log.txt smoke/ 2>/dev/null || true
          echo "== crash reports =="
          mkdir -p crashlogs
          cp ~/Library/Logs/DiagnosticReports/*yfood* crashlogs/ 2>/dev/null || echo "no crash reports (host)"
          cp ~/Library/Logs/DiagnosticReports/*pp-* crashlogs/ 2>/dev/null || true
          cp crashlogs/* smoke/ 2>/dev/null || true
          ls -lh smoke/ || true

      - name: Run in-app self tests (-autoTest)
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          {
            echo "== auto test =="
            xcrun simctl terminate "$UDID" com.tokeiyo929.myfood 2>/dev/null || true
            APPC=$(xcrun simctl get_app_container "$UDID" com.tokeiyo929.myfood data 2>&1) || true
            rm -f "$APPC/tmp/autotest/result.txt" "$APPC/tmp/autotest/done.txt" 2>/dev/null || true
            xcrun simctl launch --console "$UDID" com.tokeiyo929.myfood -autoTest > autotest-console.txt 2>&1 &
            APID=$!
            for i in $(seq 1 180); do
              if [ -f "$APPC/tmp/autotest/done.txt" ]; then echo "auto test done after ~${i}s"; break; fi
              if ! kill -0 "$APID" 2>/dev/null; then echo "app exited early at ~${i}s"; break; fi
              sleep 1
            done
            kill "$APID" 2>/dev/null || true
            wait "$APID" 2>/dev/null || true
            echo "-- result.txt --"
            cat "$APPC/tmp/autotest/result.txt" 2>&1 || echo "result.txt MISSING"
            echo "-- console tail --"
            tail -20 autotest-console.txt || true
          } > auto-test.txt 2>&1 || true
          cat auto-test.txt
          # 有 FAIL 行或没跑出结果都算失败
          if grep -q "^FAIL" auto-test.txt || ! grep -q "^PASS" auto-test.txt; then
            echo "::error::auto test failed (见 auto-test.txt)"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: myfood-unsigned-ipa
          path: myfood-unsigned.ipa
          if-no-files-found: error

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            smoke/
            smoke-debug.txt
            auto-test.txt
          if-no-files-found: ignore

      - name: Publish IPA to release
        run: |
          CR=$(ls crashlogs/* 2>/dev/null || true)
          PNGS=$(ls smoke/*.png 2>/dev/null || true)
          gh release create "ipa-${{ github.run_number }}" myfood-unsigned.ipa smoke-debug.txt auto-test.txt $CR $PNGS \
            --title "MyFood 未签名 IPA (build ${{ github.run_number }})" \
            --notes "Sideloadly 直接装这个 ipa。功能巡访截图见 smoke-screenshots artifact。" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
