name: Build unsigned iOS ipa

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned ipa (native Swift)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../myfood-unsigned.ipa Payload

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: myfood-unsigned-ipa
          path: myfood-unsigned.ipa
